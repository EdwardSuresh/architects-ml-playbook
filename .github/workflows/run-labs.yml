name: Run all labs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run every lab
        run: python scripts/run_all.py
